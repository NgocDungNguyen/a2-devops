# Frontend nginx for the Swarm stack. Mounted over /etc/nginx/conf.d/default.conf
# as a Swarm config (see docker-stack.yml) so changing it never means
# rebuilding the frontend image.
#
# The two ideas that make this file work:
#
#   1. `resolver 127.0.0.11` + proxy_pass through a VARIABLE. nginx normally
#      resolves upstream hostnames once, at startup, and refuses to start if
#      the name does not exist yet — which is exactly the frontend→backend
#      startup dependency the issue calls out. A variable forces per-request
#      resolution against Docker's embedded DNS: nginx starts happily with no
#      backend running, picks the backend up the moment it appears, and
#      forgets dead task IPs within `valid=5s` of a crash.
#
#   2. The name proxied to is `api` — a network alias shared by the stable
#      `backend` service and `backend-canary` (both endpoint_mode: dnsrr), so
#      one DNS name covers every backend task and nginx round-robins across
#      all of them. Canary traffic share == canary replica share.
#
# `upstream=$upstream_addr` in the access log shows which task IP served each
# request — `docker service logs <stack>_frontend` during a canary rollout is
# the traffic split, visible.

log_format upstreamlog '$remote_addr [$time_local] "$request" $status '
                       'upstream=$upstream_addr rt=$request_time';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log upstreamlog;

    # Product photograph uploads are larger than the 1M default.
    client_max_body_size 10M;

    # Docker's embedded DNS. Short validity so a rescheduled task's stale IP
    # is dropped quickly.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # All backend tasks, stable + canary (shared alias).
    set $api_upstream http://api:8000;
    # Stable tasks only — the fallback pool.
    set $api_stable   http://backend:8000;

    # Everything Django-shaped. /static/ is included because whitenoise serves
    # the admin/Swagger assets from inside the backend; /metrics/ feeds the
    # CloudWatch publisher; the probes are the deploy scripts' health gate.
    location ~ ^/(api|admin|healthz|readyz|metrics|static)(/|$) {
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A failed canary task must degrade to the stable pool, not to a 502
        # in a customer's face.
        error_page 502 504 = @api_fallback;
    }

    location @api_fallback {
        proxy_pass $api_stable;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded product images, from the volume shared with the backend tasks.
    # (With USE_S3=true the API hands out S3 URLs and this block goes quiet.)
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 7d;
    }

    # Runtime config must never be cached, or editing API_BASE_URL on the
    # server does nothing until every browser hard-reloads.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Hashed bundle filenames are immutable by construction.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vue SPA history-mode routes: an unknown path is a Vue route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
