[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = apps
addopts = -ra --strict-markers
markers =
    unit: fast, isolated tests — no database, no HTTP, no network
    integration: tests that exercise the API and the database together
    smoke: minimal in-process liveness/readiness checks (see also scripts/smoke_test.py for a live-deployment version)
